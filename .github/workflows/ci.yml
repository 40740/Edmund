name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

# Only the latest run per branch/PR matters; cancel older ones so private-repo
# macOS minutes (billed at 10x) aren't spent on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Package.swift declares swift-tools-version 6.0, which needs Xcode 16+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      # Cache the SwiftPM build (deps + compiled objects) keyed on the resolved
      # dependency graph, so green runs don't recompile SwiftMath etc. each time.
      - name: Cache .build
        uses: actions/cache@v5
        with:
          path: .build
          # v2: the repo was renamed md -> Edmund, which changed the checkout
          # path and invalidated absolute paths baked into the cached module
          # cache. Bump this token to discard any pre-rename .build cache.
          key: spm-v2-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-v2-${{ runner.os }}-

      # Build the app bundle first: it is what mirrors SwiftPM's per-target
      # resource bundles (SwiftMath's math fonts, the syntax definitions) into
      # the test bundle. Probe ordering alone can't find them from a .xctest —
      # neither its Contents/Resources nor the executable's directory holds them —
      # and without them every math test silently grades the Unicode fallback
      # engine instead of SwiftMath (issue #12).
      # Build the test bundle FIRST (debug — the runner's default
      # configuration, and the one some assertions are written against), then
      # package, then run with --skip-build.
      #
      # The order is the point, and it is why this is three steps: the packaging
      # step mirrors the per-target resource bundles (SwiftMath's math fonts)
      # into the .xctest, and the test runner relinks the .xctest when it builds —
      # which discards whatever was staged. Building first and skipping the
      # build at run time leaves the mirrored layout in place, so the suite
      # exercises the same bundle shape the app ships (issue #14).
      # `-enable-testing` is what the test command passes and `swift build
      # --build-tests` does not: without it every `@testable import` fails with
      # "module was not compiled for testing". The flag has to match between
      # this step and the run step or the .xctest is rebuilt and the staged
      # resources are lost again.
      - name: Build tests
        run: swift build --build-tests -Xswiftc -enable-testing

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Test
        run: |
          set -o pipefail
          # The runner executes the suite out of Xcode's `swift-pm` binary, so
          # `Bundle.main` in that process is the toolchain executable — not the
          # .xctest the packaging step just populated. Point `MathFonts` at the
          # staged copy explicitly; it validates the bundle the same way either
          # way. Pinned to the debug configuration so this and the runner agree.
          XCTEST="$(find .build -name '*.xctest' -path '*debug*' -maxdepth 4 | head -1)"
          export EDMUND_MATH_FONTS_BUNDLE="${XCTEST}/Contents/Resources/SwiftMath_SwiftMath.bundle"
          echo "EDMUND_MATH_FONTS_BUNDLE=${EDMUND_MATH_FONTS_BUNDLE}"
          swift test --skip-build -Xswiftc -enable-testing 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      # Publish the failing-test lines into the check run's output.summary,
      # which the check-runs API exposes without admin log access.
      - name: Report failures
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('test.log', 'utf8');
            const lines = log.split('\n')
              .filter(l => /✘|✗|failed|error:|Issue|issue/.test(l))
              .slice(-40);
            const msg = lines.join('\n') || log.slice(-1500);
            const { owner, repo } = context.repo;
            // GITHUB_JOB is the job's *name*; the checks API wants its numeric
            // id, so find it in the run's job list.
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId });
            const job = jobs.data.jobs.find(j => j.name === process.env.GITHUB_JOB);
            if (!job) throw new Error('job not found');
            const checkRunId = job.check_run_url.split('/').pop();
            await github.rest.checks.update({
              owner, repo, check_run_id: checkRunId,
              output: { title: 'Test failures', summary: msg.slice(0, 60000) }
            });
