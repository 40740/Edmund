name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

# Only the latest run per branch/PR matters; cancel older ones so private-repo
# macOS minutes (billed at 10x) aren't spent on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Package.swift declares swift-tools-version 6.0, which needs Xcode 16+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      # Cache the SwiftPM build (deps + compiled objects) keyed on the resolved
      # dependency graph, so green runs don't recompile SwiftMath etc. each time.
      - name: Cache .build
        uses: actions/cache@v5
        with:
          path: .build
          # v2: the repo was renamed md -> Edmund, which changed the checkout
          # path and invalidated absolute paths baked into the cached module
          # cache. Bump this token to discard any pre-rename .build cache.
          key: spm-v2-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-v2-${{ runner.os }}-

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      # Publish the failing-test lines into the check run's output.summary,
      # which the check-runs API exposes without admin log access.
      - name: Report failures
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('test.log', 'utf8');
            const lines = log.split('\n')
              .filter(l => /✘|✗|failed|error:|Issue|issue/.test(l))
              .slice(-40);
            const msg = lines.join('\n') || log.slice(-1500);
            const { owner, repo } = context.repo;
            // GITHUB_JOB is the job's *name*; the checks API wants its numeric
            // id, so find it in the run's job list.
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId });
            const job = jobs.data.jobs.find(j => j.name === process.env.GITHUB_JOB);
            if (!job) throw new Error('job not found');
            const checkRunId = job.check_run_url.split('/').pop();
            await github.rest.checks.update({
              owner, repo, check_run_id: checkRunId,
              output: { title: 'Test failures', summary: msg.slice(0, 60000) }
            });
