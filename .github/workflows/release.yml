name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger so a failed release can be re-run without re-tagging.
  workflow_dispatch:

jobs:
  release:
    name: Build & publish
    runs-on: macos-14
    permissions:
      contents: write  # create releases and commit appcast
    steps:
      # `secrets.GITHUB_TOKEN` is auto-provided by Actions and has
      # `contents: write` from the `permissions:` block above — enough to
      # check out the repo, create a release, and push the appcast commit
      # back to `main` (the fork's `main` isn't branch-protected). On the
      # upstream I7T5/Edmund repo, `main` IS protected and a real admin
      # PAT (`secrets.RELEASE_TOKEN`) is required there — set that secret
      # in the upstream repo's Settings ▸ Secrets to override.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache .build
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-v2-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-v2-${{ runner.os }}-

      - name: Build app bundle
        run: ./scripts/build-app.sh

      # create-dmg 8.x requires Node >= 20; pin it so the runner's default node
      # version can't break the release.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install create-dmg
        # sindresorhus/create-dmg is the npm package (NOT the homebrew
        # create-dmg/create-dmg tool, which has an incompatible CLI).
        run: npm install --global create-dmg

      - name: Create DMG
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # create-dmg exits 2 when it can't Developer-ID-sign / notarize the
          # image (we ship ad-hoc only) but still produces the .dmg — so don't
          # let that non-zero status fail the job.
          create-dmg build/Edmund.app build/ || true
          # It names the output "Edmund <version>.dmg"; normalize to a
          # hyphenated, URL-friendly name and fail loudly if none was produced.
          DMG_SRC="$(ls build/Edmund*.dmg 2>/dev/null | head -1)"
          if [ -z "$DMG_SRC" ]; then
            echo "create-dmg produced no .dmg" >&2
            exit 1
          fi
          mv "$DMG_SRC" "build/Edmund-${VERSION}.dmg"

      # Upload the DMG as a workflow artifact BEFORE the signing/release steps.
      # That way, if anything downstream fails (missing Sparkle key, appcast
      # push rejected by branch protection, `gh release create` race), the DMG
      # is still retrievable from the run's artifact list — no rebuild needed.
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edmund-${{ env.VERSION }}-dmg
          path: build/Edmund-${{ env.VERSION }}.dmg
          if-no-files-found: error
          retention-days: 90

      # Sparkle EdDSA signing is optional: the upstream repo sets
      # SPARKLE_ED_PRIVATE_KEY as a secret, but a fresh fork won't. Skip
      # signing when the key is absent (the DMG is still installable; only
      # the auto-update feed signature is missing). Downstream steps use
      # the ED_SIG/LENGTH env vars as empty strings in that case.
      - name: Sign archive (EdDSA)
        id: sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "No SPARKLE_ED_PRIVATE_KEY secret — skipping Sparkle signing."
            echo "ED_SIG=" >> "$GITHUB_ENV"
            echo "LENGTH=" >> "$GITHUB_ENV"
            exit 0
          fi
          SIGN_UPDATE="$(find .build -name sign_update -type f | head -1)"
          # Pass the key on stdin via --ed-key-file -. The deprecated `-s <key>`
          # is fatal for newly generated keys ("no longer supported").
          SIG_OUTPUT="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "build/Edmund-${VERSION}.dmg")"
          echo "ED_SIG=$(echo "$SIG_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"')" >> "$GITHUB_ENV"
          echo "LENGTH=$(echo "$SIG_OUTPUT" | grep -o 'length="[^"]*"' | head -1)" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk "BEGIN{p=0} /^## \[${VERSION}\]/{p=1;next} p && /^## \[/{exit} p{print}" \
            docs/CHANGELOG.md > release-notes.txt
          if [ ! -s release-notes.txt ]; then
            echo "See CHANGELOG for details." > release-notes.txt
          fi
          # `gh release create` fails if a release for this tag already exists
          # (e.g. the workflow was re-triggered). In that case, upload the DMG
          # to the existing release instead of erroring out.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — uploading DMG to it."
            gh release upload "v${VERSION}" "build/Edmund-${VERSION}.dmg" --clobber
          else
            gh release create "v${VERSION}" "build/Edmund-${VERSION}.dmg" \
              --title "Edmund ${VERSION}" \
              --notes-file release-notes.txt \
              --latest
          fi

      # Appcast update: push the new <item> to appcast.xml on main. Optional —
      # on the upstream I7T5/Edmund, `main` is branch-protected and this push
      # requires the admin PAT (RELEASE_TOKEN). On a fork with no protection,
      # the default GITHUB_TOKEN works. If the push is rejected for any reason
      # (protection, missing token), the DMG is already published — don't fail
      # the whole release over the auto-update feed.
      - name: Update appcast.xml
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          ASSET_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Edmund-${VERSION}.dmg"
          PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Info.plist)"

          # Release notes for Sparkle's update dialog (scrollable pane), built
          # from this version's CHANGELOG section. Omitted if the section is missing.
          # Built with printf (not a literal multi-line string) so this step's
          # `run: |` block scalar doesn't contain an unindented line, which
          # breaks YAML parsing of the whole workflow file.
          # $(...) strips trailing newlines, so DESC_BLOCK can't carry its own
          # trailing separator — NEW_ITEM's printf adds it explicitly instead.
          DESC_HTML="$(python3 scripts/changelog-to-html.py "$VERSION")"
          DESC_BLOCK=""
          if [ -n "$DESC_HTML" ]; then
            DESC_BLOCK="$(printf '            <description><![CDATA[\n%s\n]]></description>' "$DESC_HTML")"
          fi

          # If signing was skipped, leave the signature/length attributes empty
          # rather than emitting `sparkle:edSignature="" length=""` — Sparkle
          # treats an empty signature as "no signature" and falls back to
          # prompting the user, which is the correct behavior for an unsigned
          # build.
          SIG_ATTR=""
          LEN_ATTR=""
          if [ -n "$ED_SIG" ]; then SIG_ATTR="$ED_SIG"; fi
          if [ -n "$LENGTH" ]; then LEN_ATTR="$LENGTH"; fi

          # Built with printf (one logical YAML line) rather than a literal
          # multi-line string: an unindented line inside this value would
          # break this run block's YAML indentation (as DESC_BLOCK did above).
          NEW_ITEM="$(printf '        <item>\n            <title>Edmund %s</title>\n            <pubDate>%s</pubDate>\n%s\n            <enclosure url="%s"\n                       sparkle:version="%s"\n                       sparkle:shortVersionString="%s"\n                       %s\n                       %s\n                       type="application/x-apple-diskimage"/>\n        </item>' "$VERSION" "$PUB_DATE" "$DESC_BLOCK" "$ASSET_URL" "$BUILD" "$VERSION" "$SIG_ATTR" "$LEN_ATTR")"

          python3 - "$NEW_ITEM" <<'PYEOF'
          import sys
          new_item = sys.argv[1]
          with open("appcast.xml", "r") as f:
              content = f.read()
          content = content.replace("    </channel>", new_item + "\n    </channel>")
          with open("appcast.xml", "w") as f:
              f.write(content)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "appcast: add Edmund ${VERSION}"
          git push origin HEAD:main
