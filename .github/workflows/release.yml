name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & publish
    # macos-15 runners are Apple Silicon (arm64) — the build the M4 needs.
    runs-on: macos-15
    permissions:
      contents: write  # create releases and commit appcast
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch full history so we can push the appcast commit back.
          fetch-depth: 0
          # Default GITHUB_TOKEN: on forks `main` isn't protected, so the
          # appcast commit can be pushed without an admin PAT (RELEASE_TOKEN).

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache .build
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-v2-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-v2-${{ runner.os }}-

      - name: Build app bundle
        run: ./scripts/build-app.sh

      # create-dmg 8.x requires Node >= 20; pin it so the runner's default node
      # version can't break the release.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install create-dmg
        # sindresorhus/create-dmg is the npm package (NOT the homebrew
        # create-dmg/create-dmg tool, which has an incompatible CLI).
        run: npm install --global create-dmg

      - name: Create DMG
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # create-dmg exits 2 when it can't Developer-ID-sign / notarize the
          # image (we ship ad-hoc only) but still produces the .dmg — so don't
          # let that non-zero status fail the job.
          create-dmg build/Edmund.app build/ || true
          # It names the output "Edmund <version>.dmg"; normalize to a
          # hyphenated, URL-friendly name and fail loudly if none was produced.
          DMG_SRC="$(ls build/Edmund*.dmg 2>/dev/null | head -1)"
          if [ -z "$DMG_SRC" ]; then
            echo "create-dmg produced no .dmg" >&2
            exit 1
          fi
          mv "$DMG_SRC" "build/Edmund-${VERSION}.dmg"

      # Gate: mount the *shipped* DMG and verify the app inside it. Nothing
      # earlier in this pipeline can catch the failures that matter here — the
      # build succeeds, the release publishes, and the app refuses to launch
      # because Gatekeeper calls it "damaged" (a seal that does not match the
      # bytes) or crashes on the first equation (a resource bundle no lookup
      # reads). v5.29.0 passed every previous step and did both (issue #14).
      - name: Verify the shipped app (signature + math payloads)
        run: |
          set -euo pipefail
          DMG="build/Edmund-${VERSION}.dmg"
          MOUNT="$(mktemp -d)"
          # `|| true` + explicit detach: a failed mount must be reported by the
          # checks below, not masked into a confusing mount error.
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null

          APP="$MOUNT/Edmund.app"
          if [ ! -d "$APP" ]; then
              echo "No Edmund.app in the shipped DMG." >&2
              hdiutil detach "$MOUNT" >/dev/null || true
              exit 1
          fi

          # 1. The app must satisfy the check that decides whether it launches.
          #
          #    `codesign --verify --strict` on the whole app is the strongest
          #    form, but it will always fail *here* for one known and accepted
          #    reason: the SwiftMath resource bundle staged at the `.app` root is
          #    not described by the seal, because `codesign` refuses to seal any
          #    loose item at a bundle root. That is the shape v5.28.1 shipped and
          #    that the user confirms launches, so what must hold is:
          #
          #      * everything the seal does describe matches the bytes on disk —
          #        a change *inside* `Contents/` after signing is exactly the
          #        v5.29.0 "damaged" failure — and
          #      * the only thing the strict check reports is that one root item.
          #
          #    So assert both: the non-strict check (what Gatekeeper uses to
          #    launch) must pass, and the strict check's complaints must be
          #    limited to the app root.
          if ! codesign --verify --verbose=2 "$APP"; then
              echo "codesign --verify FAILED on the shipped app." >&2
              hdiutil detach "$MOUNT" >/dev/null || true
              exit 1
          fi
          echo "codesign --verify: OK"

          STRICT_OUT="$(codesign --verify --strict --verbose=2 "$APP" 2>&1 || true)"
          # The accepted complaint names the app bundle itself (the loose root
          # item); anything inside Contents/ is a real seal mismatch.
          UNEXPECTED="$(printf '%s\n' "$STRICT_OUT" | grep -E 'Contents/' || true)"
          if [ -n "$UNEXPECTED" ]; then
              echo "codesign --verify --strict reports problems inside Contents/:" >&2
              printf '%s\n' "$UNEXPECTED" >&2
              echo "A resource written after the seal is the usual cause; Gatekeeper" >&2
              echo "reports that to users as 'Edmund.app is damaged'." >&2
              hdiutil detach "$MOUNT" >/dev/null || true
              exit 1
          fi
          echo "codesign --verify --strict: only the known root item is unsealed"

          # 2. Every location a math-font lookup reads must hold the payload.
          #    A missing one is either a SIGTRAP on the first `$…$` document or a
          #    silent degrade to Unicode in Quick Look.
          FONT_BUNDLE="SwiftMath_SwiftMath.bundle"
          PAYLOAD="mathFonts.bundle/latinmodern-math.otf"
          for location in \
              "$APP/$FONT_BUNDLE/$PAYLOAD" \
              "$APP/Contents/Resources/$FONT_BUNDLE/$PAYLOAD" \
              "$APP/Contents/PlugIns/EdmundQuickLook.appex/Contents/Resources/$FONT_BUNDLE/$PAYLOAD"; do
              if [ ! -f "$location" ]; then
                  echo "math payload missing from the shipped app:" >&2
                  echo "  ${location#$MOUNT/}" >&2
                  hdiutil detach "$MOUNT" >/dev/null || true
                  exit 1
              fi
          done
          echo "math payloads: present at .app root, Contents/Resources and appex Contents/Resources"

          # 3. The bundle must stay *flat*. A `Contents/` directory next to the
          #    root payload makes Foundation search `Contents/Resources` and
          #    miss it — the configuration that resolves to nil and traps.
          for bundle in \
              "$APP/$FONT_BUNDLE" \
              "$APP/Contents/Resources/$FONT_BUNDLE" \
              "$APP/Contents/PlugIns/EdmundQuickLook.appex/Contents/Resources/$FONT_BUNDLE"; do
              if [ -d "$bundle/Contents" ]; then
                  echo "resource bundle carries a Contents/ directory, which hides its root payload:" >&2
                  echo "  ${bundle#$MOUNT/}" >&2
                  hdiutil detach "$MOUNT" >/dev/null || true
                  exit 1
              fi
          done
          echo "resource bundles are flat: no Contents/ to hide the payload"

          hdiutil detach "$MOUNT" >/dev/null

      # EdDSA signing needs a Sparkle key the fork may not have — skip both the
      # signature and the appcast update when it isn't configured (checked in
      # the script: the `secrets` context cannot appear in `if:` conditions).
      # The release still publishes the .dmg; only in-app auto-update needs the
      # signature.
      - name: Sign archive (EdDSA)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "No Sparkle EdDSA key configured — skipping signature."
            exit 0
          fi
          SIGN_UPDATE="$(find .build -name sign_update -type f | head -1)"
          # Pass the key on stdin via --ed-key-file -. The deprecated `-s <key>`
          # is fatal for newly generated keys ("no longer supported").
          SIG_OUTPUT="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "build/Edmund-${VERSION}.dmg")"
          echo "ED_SIG=$(echo "$SIG_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"')" >> "$GITHUB_ENV"
          echo "LENGTH=$(echo "$SIG_OUTPUT" | grep -o 'length="[^"]*"' | head -1)" >> "$GITHUB_ENV"

      # A re-pushed tag (same version, fixed build) must not collide with the
      # release from the previous push — drop it first so create succeeds.
      - name: Drop stale release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${VERSION}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk "BEGIN{p=0} /^## \[${VERSION}\]/{p=1;next} p && /^## \[/{exit} p{print}" \
            docs/CHANGELOG.md > release-notes.txt
          if [ ! -s release-notes.txt ]; then
            echo "See CHANGELOG for details." > release-notes.txt
          fi
          gh release create "v${VERSION}" "build/Edmund-${VERSION}.dmg" \
            --title "Edmund ${VERSION}" \
            --notes-file release-notes.txt \
            --latest

      - name: Update appcast.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # The appcast entry carries the EdDSA signature; without a Sparkle key
          # there is nothing to publish, so skip (guarded here rather than in an
          # `if:` — the `secrets` context is not allowed in `if:` conditions).
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "No Sparkle EdDSA key configured — skipping appcast update."
            exit 0
          fi
          REPO="${{ github.repository }}"
          ASSET_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Edmund-${VERSION}.dmg"
          PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Info.plist)"

          # Release notes for Sparkle's update dialog (scrollable pane), built
          # from this version's CHANGELOG section. Omitted if the section is missing.
          # Built with printf (not a literal multi-line string) so this step's
          # `run: |` block scalar doesn't contain an unindented line, which
          # breaks YAML parsing of the whole workflow file.
          # $(...) strips trailing newlines, so DESC_BLOCK can't carry its own
          # trailing separator — NEW_ITEM's printf adds it explicitly instead.
          DESC_HTML="$(python3 scripts/changelog-to-html.py "$VERSION")"
          DESC_BLOCK=""
          if [ -n "$DESC_HTML" ]; then
            DESC_BLOCK="$(printf '            <description><![CDATA[\n%s\n]]></description>' "$DESC_HTML")"
          fi

          # Built with printf (one logical YAML line) rather than a literal
          # multi-line string: an unindented line inside this value would
          # break this run block's YAML indentation (as DESC_BLOCK did above).
          NEW_ITEM="$(printf '        <item>\n            <title>Edmund %s</title>\n            <pubDate>%s</pubDate>\n%s\n            <enclosure url="%s"\n                       sparkle:version="%s"\n                       sparkle:shortVersionString="%s"\n                       %s\n                       %s\n                       type="application/x-apple-diskimage"/>\n        </item>' "$VERSION" "$PUB_DATE" "$DESC_BLOCK" "$ASSET_URL" "$BUILD" "$VERSION" "$ED_SIG" "$LENGTH")"

          python3 - "$NEW_ITEM" <<'PYEOF'
          import sys
          new_item = sys.argv[1]
          with open("appcast.xml", "r") as f:
              content = f.read()
          content = content.replace("    </channel>", new_item + "\n    </channel>")
          with open("appcast.xml", "w") as f:
              f.write(content)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "appcast: add Edmund ${VERSION}"
          git push origin HEAD:main
